name: Tests and Android export
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx expo-doctor
      - run: npm run export
      - uses: actions/upload-artifact@v4
        with:
          name: android-js-export
          path: dist/
